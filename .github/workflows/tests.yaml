name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # De protocollaag gebruikt alleen de standaardbibliotheek; pytest is de
      # enige ontwikkelafhankelijkheid. Home Assistant is hier bewust niet
      # nodig -- zie docs/ontwerpbeslissingen.md, beslissing 2.
      - run: pip install pytest pytest-asyncio

      - run: pytest -q
