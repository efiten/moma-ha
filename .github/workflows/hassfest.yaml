name: hassfest

# Home Assistants eigen validatie van manifest.json en de integratiestructuur.
# De dagelijkse run vangt op wanneer een nieuwe Home Assistant-release iets
# afkeurt dat vandaag nog goed is.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
